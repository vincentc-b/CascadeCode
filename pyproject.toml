[project]
name = "cascade"
version = "0.0.1"
description = "CascadeCode board store and watchdog"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "cursor-sdk>=0.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
]

[project.scripts]
cascade = "cascade.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"cascade.workspace" = ["*.java"]
"cascade.war_room" = ["templates/*.html", "static/*.html", "static/*.js", "static/*.css"]
"cascade._skill_templates" = ["design/*.md", "design/templates/*.md", "roles/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
