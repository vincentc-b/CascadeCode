name: Recovery contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Exercise durable recovery with real validation processes and Git publication
        run: python -m pytest -q tests/test_review_recovery_journey.py tests/test_review_health.py tests/test_review_rebase.py tests/test_resolution_actions.py
