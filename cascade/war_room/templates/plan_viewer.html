<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      setTimeout(function () {
        if (document.readyState === "complete") return;
        if (document.getElementById("load-deadline-banner")) return;
        var note = document.createElement("p");
        note.id = "load-deadline-banner";
        note.className = "load-deadline";
        note.setAttribute("role", "status");
        note.style.cssText =
          "color:#ffb4a8;background:#0f1115;padding:0.75rem 1rem;margin:0;font-family:system-ui,sans-serif;";
        note.textContent = "Timed out after 10s";
        if (document.body) document.body.insertBefore(note, document.body.firstChild);
      }, 10000);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="plan-page-title">Plan — loading…</title>
    <link rel="stylesheet" href="/static/plan_viewer.css?v=20261020-inline-comments" />
  </head>
  <body data-work-id="${work_id}">
    <header class="plan-header">
      <nav class="plan-nav">
        <a href="/war-room" class="plan-back-link">Back to War Room</a>
      </nav>
      <div class="plan-meta-strip" aria-live="polite">
        <dl class="plan-meta-list">
          <div class="plan-meta-item">
            <dt>Id</dt>
            <dd id="plan-meta-id">…</dd>
          </div>
          <div class="plan-meta-item">
            <dt>Title</dt>
            <dd id="plan-meta-title">Loading…</dd>
          </div>
          <div class="plan-meta-item">
            <dt>Tier</dt>
            <dd id="plan-meta-tier">…</dd>
          </div>
          <div class="plan-meta-item">
            <dt>Status</dt>
            <dd id="plan-meta-status">…</dd>
          </div>
          <div class="plan-meta-item">
            <dt>Path</dt>
            <dd id="plan-meta-path">…</dd>
          </div>
          <div class="plan-meta-item">
            <dt>SHA</dt>
            <dd id="plan-meta-sha">…</dd>
          </div>
        </dl>
        <p id="plan-meta-parent-rev-note" class="plan-meta-parent-rev" hidden></p>
      </div>
    </header>

    <main class="plan-main">
      <div id="plan-loading" class="plan-loading" aria-busy="true">Loading plan…</div>
      <div id="plan-error" class="plan-error" hidden></div>
      <article id="plan-body" class="plan-body" hidden></article>

      <section id="plan-comments" class="plan-comments" aria-label="Review threads" hidden>
        <h2 class="plan-comments-heading">Review threads</h2>
        <p class="plan-review-instructions">
          Use the + beside a plan block, or select plan text, to start a line-anchored thread.
          Agent replies appear here automatically.
        </p>
        <div
          id="plan-comment-threads"
          class="plan-comment-threads"
          role="list"
          aria-live="polite"
          aria-relevant="additions text"
        ></div>
        <p id="plan-comment-selection-bar" class="plan-comment-selection-bar" hidden>
          <button type="button" id="plan-comment-on-selection">Comment on selection</button>
        </p>
        <div class="plan-global-comment">
          <h3 class="plan-global-comment-heading">Comment on the whole plan</h3>
          <form id="plan-comment-compose" class="plan-comment-compose">
            <p id="plan-comment-compose-hint" class="plan-comment-compose-hint">
              This comment applies to the plan as a whole.
            </p>
            <label class="plan-comment-field">
              Global comment
              <textarea id="plan-comment-body" name="body" rows="4" required></textarea>
            </label>
            <label class="plan-comment-blocking blocking-toggle">
              <input type="checkbox" id="plan-comment-blocking" name="blocking" />
              Blocking
            </label>
            <button type="submit" id="plan-comment-send">Post comment</button>
          </form>
        </div>
        <p id="plan-comment-status" class="plan-comment-status" role="status"></p>
      </section>
    </main>

    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/plan_viewer.js?v=20261020-inline-comments"></script>
  </body>
</html>
