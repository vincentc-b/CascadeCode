# Workspace supervisor config. Watchdog is the only reader that
# may start work; planning agents must not parse this to self-dispatch.

task_parallelism = 4

[worker]
drain_seconds = 120

[validation]
# The full review gate collects more than 2,400 tests.
review_timeout_seconds = 1200

# Once an epic is activated, dependency-ready feature and task plans run without
# separate dispatch clicks. The watchdog also fast-forwards the checked-out
# product trunk to discover merged brief MRs.
[automation]
enabled = true
poll_seconds = 15
remote = "origin"

# Provider-specific model defaults. Boss uses the epic tier when omitted.
[providers]
default = "cursor"

[providers.cursor]
epic = "claude-opus-5-5"       # epic_manager, epic_architect
feature = "claude-sonnet-5-5"  # feature_lead, feature_architect
task = "composer-2.5"          # swe

[providers.cursor.launch]
# Provider sandbox bypass does not grant lifecycle or dependency-install authority.
permissions = "yolo"

[providers.claude.launch]
permissions = "yolo"

[providers.codex]
task = "gpt-5.6-sol"            # swe for Codex-backed work

[providers.codex.launch]
permissions = "yolo"
